      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="url(#rb)"/>
  <g>
    <rect x="150" width="46" height="700" fill="#cdc2ac" opacity="0.8"/>
    <rect x="196" width="10" height="700" fill="#9b9079" opacity="0.7"/>
    <rect x="470" width="46" height="700" fill="#cdc2ac" opacity="0.6"/>
    <rect x="516" width="10" height="700" fill="#9b9079" opacity="0.5"/>
    <rect x="820" width="46" height="700" fill="#cdc2ac" opacity="0.45"/>
    <rect x="866" width="10" height="700" fill="#9b9079" opacity="0.4"/>
  </g>
  <path d="M206 0 L470 0 L330 700 L60 700 Z" fill="url(#rl)"/>
  <path d="M526 0 L700 0 L610 700 L420 700 Z" fill="url(#rl)" opacity="0.55"/>
