<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <linearGradient id="rb" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f2ede2"/>
      <stop offset="0.6" stop-color="#e0d8c8"/>
      <stop offset="1" stop-color="#c3b9a4"/>
    </linearGradient>
    <linearGradient id="rl" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fffdf6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fffdf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rd" x1="1" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#312d24" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#312d24" stop-opacity="0"/>
    </linearGradient>
    <filter id="rblur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="rgrain">
